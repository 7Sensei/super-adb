[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-adb"
version = "2.5.0"
description = "Desktop ADB utility built with CustomTkinter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2,<7"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.gui-scripts]
super-adb = "super_adb.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/super_adb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
